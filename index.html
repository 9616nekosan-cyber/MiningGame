<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>採掘ゲーム</title>
        <link rel="icon" type="image/jpeg" href="img/wooden_pickaxe.jpg">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="top-row row" style="border: 2px solid #000">
                <div class="box">
                    <div id="inventory" class="sub-box">
                        <div class="row1">
                            <div class="item">
                                <img src="./img/cobblestone.jpg" width="35">: 
                                <span id="cobblestone-count"></span>個
                            </div>

                            <div class="item">
                                <img src="img/coal.jpg" width="35">: 
                                <span id="coal-count"></span>個
                            </div>

                            <div class="item">
                                <img src="img/iron_ingot.jpg" width="35">: 
                                <span id="iron-ingot-count"></span>個
                            </div>
                        </div>

                        <div class="row2">
                            <div class="item">
                                <img src="img/gold_ingot.jpg"width="35">: 
                                <span id="gold-ingot-count"></span>個
                            </div>

                            <div class="item">
                                <img src="img/diamond.jpg" width="35">: 
                                <span id="diamond-count"></span>個
                            </div>

                            <div class="item">
                                <img src="img/emerald.jpg" width="35">: 
                                <span id="emerald-count"></span>個
                            </div>

                            <div class="item">
                                <img src="img/mystery_ore.png"width="35">: 
                                <span id="mystery-ore-count"></span>
                            </div>
                        </div>
                    </div>
                    <div class="sub-box" style="display: flex; justify-content: center; align-items: center;">
                        <button id="mystery-ore" class="imgbtn">
                            <img src="img/mystery_ore.png" alt="謎の鉱石">つかう
                        </button>
                    </div>
                </div>

                <div class="box">
                    <div style="display: flex;">
                        <div class="item">
                            <img id="pickaxe" src="img/wooden_pickaxe.jpg" width="80">
                        </div>

                        <div class="item">
                                <img src="img/iron_spear.jpg"width="80">: 
                                <span id="drill-count"></span>個
                        </div>
                    </div>
                    <button id="stone" class="imgbtn">
                        <img src="img/stone.jpg">
                    </button>
                </div>

                <div class="box" style="display: none;">
                    <h1>強化してニューゲーム</h1>
                    <h2>現在の経験値: <span id="ex"></span>pt</h2>
                    <button id="reset">強化 & リセット</button>
                </div>
            </div>

            <div class="bottom-row row">
                <div class="box" style="border: 2px solid #000000;">
                    <h1>換金</h1>
                    <div style="display: flex;">
                        <div>
                            <div>
                                <img src="img/cobblestone.jpg" width="80" height="80"> ⇒ <img src="img/emerald.jpg" width="80" height="80">1
                                <button id="exchange-cobblestone" class="exchange">すべて換金</button>
                            </div>

                            <div>
                                <img src="img/gold_ingot.jpg" width="80" height="80"> ⇒ <img src="img/emerald.jpg" width="80" height="80">256
                                <button id="exchange-gold" class="exchange">すべて換金</button>
                            </div>
                        </div>

                        <div>
                            <div>
                                <img src="img/coal.jpg" width="80" height="80"> ⇒ <img src="img/emerald.jpg" width="80" height="80">8
                                <button id="exchange-coal" class="exchange">すべて換金</button>
                            </div>

                            <div>
                                <img src="img/diamond.jpg" width="80" height="80"> ⇒ <img src="img/emerald.jpg" width="80" height="80">1024
                                <button id="exchange-diamond" class="exchange">すべて換金</button>
                            </div>
                        </div>

                        <div>
                            <div>
                                <img src="img/iron_ingot.jpg" width="80" height="80"> ⇒ <img src="img/emerald.jpg" width="80" height="80">32
                                <button id="exchange-iron" class="exchange">すべて換金</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="box" style="border: 2px solid #000000; width: 100%; padding: 15px;">
                    <h1>ショップ</h1>
                    <div style="display: flex">
                        <div id="pickaxe-shop">
                            <img src="img/emerald.jpg" width="80" height="80"><span id="pickaxe-price"></span> ⇒ <img id="pickaxe-shop-img" src="img/stone_pickaxe.jpg" width="80" height="80">
                            <button id="upgrade-pickaxe" class="upgrade" style="height:3em">アップグレード</button>
                        </div>

                        <div>
                            <img src="img/emerald.jpg" width="80" height="80"><span id="drill-price"></span> ⇒ <img src="img/iron_spear.jpg" width="80" height="80">
                            <button id="buy-drill" class="buy" style="height:3em">購入</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="variable.js"></script>
        <script src="main.js"></script>
    </body>
</html>
